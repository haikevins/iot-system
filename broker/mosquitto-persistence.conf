# IoT pipeline durability settings for Eclipse Mosquitto.
# Install this as a global snippet, for example:
#   /etc/mosquitto/conf.d/iot-persistence.conf

persistence true
persistence_location /var/lib/mosquitto/
persistence_file mosquitto.db

# Persist queued QoS/session changes aggressively. This reduces the window in
# which an abrupt broker power loss can discard a recently queued message.
autosave_interval 1
autosave_on_changes true
