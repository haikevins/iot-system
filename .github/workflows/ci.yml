name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject tracked local configuration
        shell: bash
        run: |
          set -euo pipefail

          tracked_local_files="$(
            git ls-files | grep -E '(^|/)\.env$|\.uvguix($|\.)|(^|/)secrets\.h$' || true
          )"

          if [[ -n "${tracked_local_files}" ]]; then
            echo "Local-only files must not be tracked:"
            printf '%s\n' "${tracked_local_files}"
            exit 1
          fi

      - name: Verify configuration templates
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/.env.example
          test -f frontend/.env.example
          test -f gateway/include/secrets.example.h

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Prepare CI configuration
        run: cp include/secrets.example.h include/secrets.h

      - name: Build ESP32 gateway
        run: pio run
